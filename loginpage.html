<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Pacifico:wght@400&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<script src='https://kit.fontawesome.com/9603c04a31.js' crossorigin='anonymous'></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
<title>Auth - Fancy Surprise Planner</title>

<script>
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        primary: "#f7bad9",
        "background-light": "#f8f6f7",
        "background-dark": "#211119",
      },
      fontFamily: {
        display: ["Inter"],
        heading: ["Pacifico"],
      },
    },
  },
};
</script>

<style>
.fade-slide {
  transition: all 0.4s ease;
}
.fade-out {
  opacity: 0;
  transform: translateY(10px);
}
</style>

</head>

<body class="font-display bg-background-light dark:bg-background-dark text-black dark:text-white">

<!-- HEADER -->
<header class="fixed top-0 left-0 w-full z-50 bg-background-light dark:bg-background-dark border-b border-primary/20">
  <div class="max-w-7xl mx-auto flex items-center justify-between px-6 py-4">

    <!-- LOGO -->
    <div class="flex items-center gap-3">
      <i class="fa-solid fa-gift text-primary" style="scale:1.3;"></i>
      <h1 class="font-heading font-bold text-lg">Fancy Surprise Planner</h1>
    </div>

    <!-- RIGHT -->
    <div class="flex items-center gap-3">

      <!-- BACK -->
      <a href="index.html"
        class="rounded-full border border-primary/30 px-4 py-2 text-sm hover:bg-primary/10 transition">
        Back
      </a>

      <!-- THEME -->
     <button onclick="toggleTheme()"
  class="flex items-center justify-center rounded-full h-10 w-10 
  bg-background-light dark:bg-background-dark 
  border border-primary/20 dark:border-primary/30 
  text-black dark:text-white 
  hover:bg-primary/10 dark:hover:bg-primary/20 transition">

  <span class="material-symbols-outlined dark:hidden">light_mode</span>
  <span class="material-symbols-outlined hidden dark:inline">dark_mode</span>

</button>

    </div>
  </div>
</header>

<!-- MAIN -->
<section class="min-h-screen flex items-center justify-center bg-gradient-to-br from-pink-50 to-pink-100 dark:from-[#2b1b27] dark:to-[#3a212f] px-6 pt-24">

  <div class="w-full max-w-md bg-white/60 dark:bg-white/5 backdrop-blur-sm border border-primary/20 rounded-2xl shadow-md p-8 flex flex-col gap-6 fade-slide">

    <!-- TITLE -->
    <div class="text-center fade-slide" id="textBlock">
      <h1 id="title" class="font-heading text-3xl font-bold">
        Welcome <span class="text-primary">Back</span>
      </h1>
      <p id="subtitle" class="text-sm text-black/70 dark:text-white/70 mt-2">
        Sign in to continue
      </p>
    </div>

    <!-- FORM -->
    <form class="space-y-6" onsubmit="handleSubmit(event)">

      <div id="nameField" class="hidden">
        <label class="block text-sm mb-2">Name</label>
        <input type="text" id="name"
        class="w-full rounded-xl border border-primary/30 bg-background-light dark:bg-background-dark py-4 px-5 shadow-md focus:ring-2 focus:ring-primary transition-all">
      </div>

      <div>
        <label class="block text-sm mb-2">Email</label>
        <input type="email" id="email" required
        class="w-full rounded-xl border border-primary/30 bg-background-light dark:bg-background-dark py-4 px-5 shadow-md focus:ring-2 focus:ring-primary transition-all">
      </div>

      <!-- PASSWORD -->
      <div class="relative">
        <label class="block text-sm mb-2">Password</label>

        <input type="password" id="password" required
          class="w-full rounded-xl border border-primary/30 bg-background-light dark:bg-background-dark py-4 px-5 pr-12 shadow-md focus:ring-2 focus:ring-primary transition-all">

        <button type="button" onclick="togglePassword()"
          class="absolute inset-y-0 right-0 flex items-center pr-4 text-black/60 dark:text-white/60 hover:text-primary">

          <!-- open -->
          <svg id="eyeOpen" class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0"/>
            <path stroke-width="2" d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/>
          </svg>

          <!-- closed -->
          <svg id="eyeClosed" class="h-5 w-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-width="2" d="M3 3l18 18M10.5 10.5a3 3 0 004.24 4.24"/>
          </svg>

        </button>
      </div>

      <p id="errorMsg" class="text-red-500 text-sm hidden"></p>

      <button id="submitBtn"
        class="w-full rounded-full bg-primary text-white py-3 font-semibold shadow-md hover:opacity-90 transition">
        Login
      </button>

    </form>

    <!-- TOGGLE -->
    <div class="text-center text-sm text-black/70 dark:text-white/70">
      <p id="toggleText">
        Don't have an account?
        <button onclick="toggleMode()" class="text-primary font-semibold hover:underline">
          Register
        </button>
      </p>
    </div>

  </div>
</section>

<script>
let isLogin = true;

function toggleMode() {
  const block = document.getElementById("textBlock");
  block.classList.add("fade-out");

  setTimeout(() => {
    isLogin = !isLogin;

    const title = document.getElementById("title");
    const subtitle = document.getElementById("subtitle");
    const nameField = document.getElementById("nameField");
    const btn = document.getElementById("submitBtn");
    const toggle = document.getElementById("toggleText");

    if (isLogin) {
      title.innerHTML = `Welcome <span class="text-primary">Back</span>`;
      subtitle.innerText = "Sign in to continue";
      nameField.classList.add("hidden");
      btn.innerText = "Login";
      toggle.innerHTML = `Don't have an account?
        <button onclick="toggleMode()" class="text-primary font-semibold hover:underline">Register</button>`;
    } else {
      title.innerHTML = `Create <span class="text-primary">Account</span>`;
      subtitle.innerText = "Join us and start creating surprises";
      nameField.classList.remove("hidden");
      btn.innerText = "Register";
      toggle.innerHTML = `Already have an account?
        <button onclick="toggleMode()" class="text-primary font-semibold hover:underline">Login</button>`;
    }

    block.classList.remove("fade-out");
  }, 200);
}

function togglePassword() {
  const input = document.getElementById("password");
  const open = document.getElementById("eyeOpen");
  const closed = document.getElementById("eyeClosed");

  if (input.type === "password") {
    input.type = "text";
    open.classList.add("hidden");
    closed.classList.remove("hidden");
  } else {
    input.type = "password";
    open.classList.remove("hidden");
    closed.classList.add("hidden");
  }
}

function toggleTheme() {
  document.documentElement.classList.toggle("dark");
}
toggleTheme();
function handleSubmit(e) {
  e.preventDefault();

  const email = email.value.trim();
  const password = password.value.trim();
  const nameVal = name.value.trim();

  if (!email || !password || (!isLogin && !nameVal)) {
    return showError("Fill all fields");
  }

  if (password.length < 6) {
    return showError("Password must be at least 6 characters");
  }

  alert(isLogin ? "Login success (fake)" : "Registered (fake)");
}

function showError(msg) {
  const el = document.getElementById("errorMsg");
  el.innerText = msg;
  el.classList.remove("hidden");
}
</script>

</body>
</html>
